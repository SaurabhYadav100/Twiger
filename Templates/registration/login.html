{% extends 'layout.html' %}
{% block title %} Login {% endblock %} <!--Django template block allows inheritance each child template override the parent template block, if they are common block-->
{% block welcome %}{% endblock %}
{% block content %}

 <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">   

<h2 class="mb-4 mt-5">Login to Twiger</h2>
<form method="post">
	{% csrf_token %}
	{{form.as_p}}
	<button class="btn btn-primary">Login</button>
</form>
<p class="mt-3">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</div>
</div>
</div>
{% endblock %}
